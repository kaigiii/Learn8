services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learn8_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/learn8_db:/app/learn8_db
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/logs:/app/logs
      - ./backend/.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://learn8_user:learn8_password@postgres:5432/learn8_db
      - REDIS_URL=redis://learn8_redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: learn8_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: learn8_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=learn8_user
      - POSTGRES_PASSWORD=learn8_password
      - POSTGRES_DB=learn8_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learn8_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_REWRITE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  learn8_db:
  chroma_db:
  uploads:
  pgdata:
