<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Recent ladder movement icon</title>
  <desc id="desc">A parchment scroll with a wooden ladder, symbolizing rank climbing history.</desc>

  <defs>
    <linearGradient id="parchmentMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9ebcd" />
      <stop offset="0.55" stop-color="#ecd4a8" />
      <stop offset="1" stop-color="#d8b980" />
    </linearGradient>
    <linearGradient id="parchmentEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa268" />
      <stop offset="1" stop-color="#8d6039" />
    </linearGradient>
    <linearGradient id="ladderWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c78a52" />
      <stop offset="0.55" stop-color="#9d6438" />
      <stop offset="1" stop-color="#6b4124" />
    </linearGradient>
    <linearGradient id="ladderHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d8b0" stop-opacity="0.8" />
      <stop offset="1" stop-color="#f3d8b0" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="36" y="20" width="84" height="118" rx="14" fill="url(#parchmentMain)" />

