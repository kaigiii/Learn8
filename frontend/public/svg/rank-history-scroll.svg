    <line x1="61" y1="81" x2="78" y2="81" stroke="url(#ladderWood)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="64" y1="93" x2="81" y2="93" stroke="url(#ladderWood)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="67" y1="105" x2="84" y2="105" stroke="url(#ladderWood)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="70" y1="117" x2="87" y2="117" stroke="url(#ladderWood)" stroke-width="4.5" stroke-linecap="round" />
