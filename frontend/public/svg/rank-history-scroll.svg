    <path d="M36 120c-10 0-18 8-18 18h18z" fill="url(#parchmentMain)" />

    <rect x="48" y="42" width="56" height="2.6" rx="1.3" fill="#d7ba87" opacity="0.65" />
    <rect x="48" y="56" width="56" height="2.6" rx="1.3" fill="#d7ba87" opacity="0.65" />
    <rect x="48" y="70" width="56" height="2.6" rx="1.3" fill="#d7ba87" opacity="0.65" />
