    <path d="M36 130h84v8H36z" fill="url(#parchmentEdge)" opacity="0.28" />

    <ellipse cx="78" cy="20" rx="42" ry="8" fill="#f6e3bf" />
    <ellipse cx="78" cy="138" rx="42" ry="8" fill="#e7c996" />

