<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Topic strengths icon</title>
  <desc id="desc">A warm golden tree growing from a stack of books.</desc>

