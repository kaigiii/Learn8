<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Light blue circular background -->
  <circle cx="32" cy="32" r="32" fill="#d4eef0"/>
  <circle cx="32" cy="32" r="26" fill="#e0f3f4"/>
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="14" ry="16" fill="#c9a96e"/>
  <ellipse cx="32" cy="40" rx="10" ry="12" fill="#e8d5a8"/>
  <!-- Head -->
  <ellipse cx="32" cy="26" rx="13" ry="11" fill="#c9a96e"/>
  <!-- Ear tufts -->
  <ellipse cx="22" cy="18" rx="3" ry="5" fill="#c9a96e" transform="rotate(-15 22 18)"/>
  <ellipse cx="42" cy="18" rx="3" ry="5" fill="#c9a96e" transform="rotate(15 42 18)"/>
  <!-- Face disc -->
  <ellipse cx="32" cy="27" rx="10" ry="8" fill="#e8d5a8"/>
  <!-- Left eye white -->
  <circle cx="27" cy="26" r="5" fill="white" stroke="#8b7355" stroke-width="0.8"/>
  <!-- Right eye white -->
  <circle cx="37" cy="26" r="5" fill="white" stroke="#8b7355" stroke-width="0.8"/>
  <!-- Left pupil -->
  <circle cx="27" cy="26" r="2.8" fill="#3a3a3a"/>
  <circle cx="26.2" cy="25.2" r="0.8" fill="white"/>
  <!-- Right pupil -->
  <circle cx="37" cy="26" r="2.8" fill="#3a3a3a"/>
  <circle cx="36.2" cy="25.2" r="0.8" fill="white"/>
  <!-- Beak -->
  <polygon points="32,29 30,32 34,32" fill="#e8734a"/>
  <!-- Feet -->
  <ellipse cx="27" cy="53" rx="4" ry="2" fill="#e8734a"/>
  <ellipse cx="37" cy="53" rx="4" ry="2" fill="#e8734a"/>
</svg>
