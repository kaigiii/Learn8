name: GoCaptureStones
frontend_registry_key: GoCaptureStones
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner find WHERE to play to capture the opponent's stones.
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt asking WHERE the player should play to capture, e.g. "黑棋下在哪裡可以把白棋提走？". Do NOT ask for a count of stones.
  - board: A fresh AI-generated go position as a list of equal-length strings (one per row, top row first) or a board object with a "rows" list; use "." for empty points, "B" for black, and "W" for white. The position MUST contain at least one white group in atari (exactly one liberty). Do not use "X" — the answer point must stay empty so it is not revealed.
  - expectedAnswer: The coordinate of the capturing move in board notation — a column letter (A, B, C … from the left) followed by a row number counted from the BOTTOM (bottom row is 1), e.g. "D3". It must be the single empty liberty of a white group in atari.
  - explanation: Optional explanation shown after submission.
  - Grading recomputes the capturing point directly from the board and accepts any move that captures a white group, so the drawn position must be self-consistent.
  - The board should be generated by an AI so each question uses a different legal position.
