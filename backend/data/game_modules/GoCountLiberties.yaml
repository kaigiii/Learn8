name: GoCountLiberties
frontend_registry_key: GoCountLiberties
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner count the liberties of a marked go group.
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt that explains what to solve.
  - board: A fresh AI-generated go position represented as a list of equal-length strings (one per row) or a board object with a "rows" list; use "." for empty points, "B" for black, "W" for white, and "X" for EVERY stone of the group whose liberties are being counted.
  - The board MUST be a square grid, and every stone in the target group MUST be written as "X" (do not leave the group as "B"/"W"). Grading counts the empty points orthogonally adjacent to the "X" group directly from the board, so the drawn position must be self-consistent.
  - expectedAnswer: The correct number of liberties, such as "4". This should match the "X" group on the board; when it disagrees, the board is treated as authoritative.
  - explanation: Optional explanation shown after submission.
  - The board should be generated by an AI so each question uses a different legal position.
