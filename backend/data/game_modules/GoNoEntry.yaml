name: GoNoEntry
frontend_registry_key: GoNoEntry
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner identify Black's forbidden no-entry (suicide) point.
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt asking which empty point is Black's no-entry point (禁入點 — a spot Black is not allowed to play).
  - board: A fresh AI-generated go position as a list of equal-length strings (one per row, top row first) or a board object with a "rows" list; use "." for empty points, "B" for black, and "W" for white. Do NOT use "X"; keep the answer point EMPTY so it is not revealed.
  - The board MUST contain a genuine no-entry point for Black: an EMPTY intersection whose every orthogonal on-board neighbour is a WHITE stone (a fully enclosed point / eye). The enclosing white stones MUST have at least one other liberty elsewhere so they cannot be captured — then Black playing there would have zero liberties and capture nothing, which is illegal. A point next to any empty intersection is NOT a no-entry point.
  - expectedAnswer: The coordinate of that no-entry point — a column letter (A, B, C … from the left) followed by a row number counted from the BOTTOM (bottom row is 1), e.g. "B2".
  - explanation: Optional explanation shown after submission.
  - Grading recomputes the no-entry points directly from the board (Black to play) and accepts any coordinate that is genuinely forbidden, so the drawn position must be self-consistent.
  - The board should be generated by an AI so each question uses a different legal position.
