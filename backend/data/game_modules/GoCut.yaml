name: GoCut
frontend_registry_key: GoCut
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner identify the move that cuts a connection.
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt that asks for the cut point.
  - board: A fresh AI-generated go position represented as a list of strings or a board object; use "." for empty points, "B" for black, "W" for white, and "X" for the connection to break.
  - expectedAnswer: The correct coordinate answer, such as "H6".
  - explanation: Optional explanation shown after submission.
  - The board should be generated by an AI so each question uses a different legal position.
