name: "HeapSortExercise"
frontend_registry_key: "HeapSortExercise"
description: "提供互動式堆積排序練習，讓使用者手動執行交換與調整步驟以完成排序。"
allowed_in_remedial: true
required_config_data_fields:
  - "initialArray"
  - "title"
  - "explanation"
optional_config_data_fields:
  - "messages"
  - "hints"
submission_keys:
  - "completed"
  - "errorCount"
schema_requirements: |
  - `initialArray`: Array of integers (e.g., [10, 5, 8, 2, 4]).
  - `title`: String, title of the exercise.
  - `explanation`: String, instructions for the user.
  - `messages`: Optional object containing 'initial', 'successSwap', 'successExtract', 'errorSwap', 'errorInvalid'.
  - `hints`: Optional array of strings for step-by-step help.
