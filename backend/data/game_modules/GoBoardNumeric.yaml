name: GoBoardNumeric
frontend_registry_key: GoBoardNumeric
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
optional_config_data_fields:
  - board_blueprint
  - playerColor
  - board
  - expectedAnswer
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner count a specific value on the Go board (e.g. number of liberties of marked group, number of territory eyes).
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt explaining what to count (e.g., "被標記的棋子共有幾口氣？").
  - board_blueprint: You MUST populate this field with a clear, step-by-step textual description of the board situation (e.g., "Board size 9. One Black stone at E5. White stones surrounding E5 at D5, F5, and E4. A mark is placed on E5. The player's turn is White. The expected answer is 4, which is the number of liberties of the marked Black stone.").
  - playerColor: Color ("B" or "W") indicating whose turn it is.

  CRITICAL RULES:
  - You MUST NOT try to populate the complex `board` dictionary or `expectedAnswer` directly. Leave them empty/omitted. A downstream specialist mapper agent will compile your `board_blueprint` into precise coordinate lists and validate them against rules of Go.
  - All text fields (question, explanation, prompts) MUST be in the preferred language of the learner.

