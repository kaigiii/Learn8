name: "HeapSortSimulator"
frontend_registry_key: "HeapSortSimulator"
description: "自動化的堆積排序動畫演示，展示建立堆積與提取根節點的完整流程。"
allowed_in_remedial: false
required_config_data_fields:
  - "initialArray"
  - "title"
  - "explanation"
optional_config_data_fields:
  - "messages"
schema_requirements: |
  - `initialArray`: Array of integers.
  - `title`: String, title of the simulator.
  - `explanation`: String, pedagogical context.
  - `messages`: Optional object containing 'ready', 'building', 'sorting', 'done'.
