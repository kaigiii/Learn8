name: GoCountTerritory
frontend_registry_key: GoCountTerritory
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner count the territory on a go board.
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt that asks for the territory count.
  - board: A fresh AI-generated go position represented as a list of strings or a board object; use "." for empty points, "B" for black, "W" for white, and "X" for the territory to count.
  - expectedAnswer: The correct territory count, such as "7".
  - explanation: Optional explanation shown after submission.
  - The board should be generated by an AI so each question uses a different legal position.
