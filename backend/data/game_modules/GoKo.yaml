name: GoKo
frontend_registry_key: GoKo
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner choose the correct ko response on a go board.
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt that asks for the legal ko reply.
  - board: A fresh AI-generated go position represented as a list of strings or a board object; use "." for empty points, "B" for black, "W" for white, and "X" for the ko point.
  - expectedAnswer: The correct coordinate answer, such as "D4".
  - explanation: Optional explanation shown after submission.
  - The board should be generated by an AI so each question uses a different legal position.
