name: FeynmanMirror
frontend_registry_key: FeynmanMirror
allowed_in_remedial: true
voice_targets:
  - prompt
required_config_data_fields: []
optional_config_data_fields:
  - prompt
  - sampleAnswer
  - maxRounds
submission_keys:
  - explanation
  - history
description: If the goal is to verify deep understanding via interactive multi-turn teaching (Feynman Technique).
schema_requirements: |
  Component `FeynmanMirror` supports:
  - `prompt` (string): The initial question or curiosity expressed by the AI student to start the conversation.
  - `sampleAnswer` (string): A model explanation that represents deep understanding of the concept.
  - `maxRounds` (integer): The maximum number of dialogue turns before the challenge ends. You should choose a value that is pedagogically appropriate for the complexity of the topic (e.g., 3-5 for simple concepts, 8-12 for complex ones).
