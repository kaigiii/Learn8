name: GoBoardCoordinate
frontend_registry_key: GoBoardCoordinate
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
optional_config_data_fields:
  - board_blueprint
  - playerColor
  - board
  - expectedAnswer
  - acceptableAnswers
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner select a single coordinate on the Go board (e.g. capture, connect, cut, escape, vital point, no-entry point).
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt explaining what to solve (e.g., "黑棋下在哪裡可以把白棋提走？").
  - board_blueprint: You MUST populate this field with a clear, step-by-step textual description of the board situation (e.g., "Board size 9. One Black stone at E5. White stones surrounding E5 at D5, F5, and E4. The player's turn is White, aiming to capture the Black stone at E5 by playing at E6.").
  - playerColor: Color ("B" or "W") indicating whose turn it is.

  CRITICAL RULES:
  - You MUST NOT try to populate the complex `board` dictionary or `expectedAnswer` directly. Leave them empty/omitted. A downstream specialist mapper agent will compile your `board_blueprint` into precise coordinate lists and validate them against rules of Go.
  - All text fields (question, explanation, prompts) MUST be in the preferred language of the learner.

