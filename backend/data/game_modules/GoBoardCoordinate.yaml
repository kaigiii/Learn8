name: GoBoardCoordinate
frontend_registry_key: GoBoardCoordinate
allowed_in_remedial: true
voice_targets:
  - question
required_config_data_fields:
  - question
  - board
  - expectedAnswer
optional_config_data_fields:
  - playerColor
  - acceptableAnswers
  - explanation
submission_keys:
  - answer
description: If the goal is to let the learner select a single coordinate on the Go board (e.g. capture, connect, cut, escape, vital point, no-entry point).
schema_requirements: |
  config.data MUST contain:
  - question: A concise prompt explaining what to solve (e.g., "黑棋下在哪裡可以把白棋提走？").
  - board: A dictionary representing the board coordinate placements:
    - size: An integer for the board size (e.g. 5, 9, 13, 19).
    - black: A list of standard coordinate strings for Black stones (e.g. ["C4", "E4"]).
    - white: A list of standard coordinate strings for White stones (e.g. ["D3"]).
    - marks: A list of standard coordinate strings to overlay with a marked symbol (e.g. ["C4"]).
    (Or legacy list of equal-length strings, one per row).
  - playerColor: Optional color hint ("B" or "W") indicating whose turn it is. Defaults to "B".
  - expectedAnswer: The correct coordinate notation (e.g. "C4") matching standard board notation.
  - acceptableAnswers: Optional list of all correct coordinate notations (e.g. ["C4", "D4"]).
  - explanation: Optional explanation text shown after submission.
