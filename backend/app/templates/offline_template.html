<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>離線學習播放器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;500;600;700&family=Righteous&display=swap");

    /* ── Hide scrollbars globally but keep scroll behavior ── */
    html,
    body,
    * {
      -ms-overflow-style: none;  /* IE/Edge */
      scrollbar-width: none;     /* Firefox */
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;             /* Chrome/Safari/Opera */
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .lesson-session-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .lesson-session-scroll::-webkit-scrollbar {
      display: none;
    }

    /* ── App background class matching ── */
    .app-shared-bg {
      background-color: #d9ecf6;
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.1)), url("/backgrounds/MainBg.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .text-shadow-sm {
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* ── Particle animations ── */
    @keyframes float-up {
      0% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(var(--drift, 20px)) scale(0.4);
        opacity: 0;
      }
    }

    @keyframes shimmer {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @keyframes drift {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      15% {
        opacity: 0.7;
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(var(--float-y, -80px)) translateX(var(--float-x, 30px));
        opacity: 0;
      }
    }

    .particle {
      animation: float-up var(--duration, 12s) var(--delay, 0s) infinite ease-in-out;
    }

    .sparkle {
      animation: shimmer var(--duration, 3s) var(--delay, 0s) infinite ease-in-out;
    }

    .floater {
      animation: drift var(--duration, 8s) var(--delay, 0s) infinite ease-in-out;
    }

    /* ── GameButton pulse ── */
    @keyframes pulse-subtle {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 14px rgba(88, 204, 2, 0.3);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(88, 204, 2, 0.5);
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 2s ease-in-out infinite;
    }

    /* ── Shake animation ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    /* ── XP bar shimmer ── */
    @keyframes shimmer-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .animate-shimmer-bar {
      animation: shimmer-bar 1.5s ease-in-out infinite;
    }
  </style>
  <script>
    // 配置 Tailwind theme 以配合我們原本的應用風格
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: "#58CC02",
              "green-dark": "#46a302",
              coral: "#E8734A",
              "coral-dark": "#d4623c",
              teal: "#7AC7C4",
              "teal-light": "#B8E6E3",
              "teal-bg": "#E8F5F4",
              gray: {
                50: "#F7F7F7",
                100: "#EEEEEE",
                200: "#E2E2E2",
                300: "#CBCBCB",
                400: "#AFAFAF",
                500: "#6B6B6B",
                600: "#545454",
                700: "#333333",
              },
            },
          },
          fontFamily: {
            heading: ["'Nunito'", "sans-serif"],
            body: ["'Open Sans'", "sans-serif"],
            display: ["'Righteous'", "sans-serif"],
          },
        }
      }
    };
  </script>
</head>
<body class="app-shared-bg text-slate-100 overflow-hidden min-h-screen">
  <div id="root"></div>

  <!-- Mock process variable -->
  <script>
    window.process = { env: { NODE_ENV: 'production' } };
  </script>

  <!-- 內嵌課程 JSON 數據 -->
  <script>
    window.__COURSE_EXPORT_DATA__ = null; /* __EXPORT_DATA_PLACEHOLDER__ */;
  </script>

  <!-- 內嵌離線 React App 編譯後的 JS 代碼 -->
  <script>
    /* __OFFLINE_PLAYER_JS__ */
  </script>
</body>
</html>
